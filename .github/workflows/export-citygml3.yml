# Manual CityGML 3.0 export of a city (scripts/export_citygml3.py, docs/citygml2-to3-iur4.md).
# Moved here from sample-tokyo-station (2026-09-30): the converter is this repository at the
# commit the run is dispatched on, so the derivative always names the converter that made it.
# The data folders and the dialect pack come from the city's declaration. Nothing is committed or
# pushed: the result is a 7-day artifact. A pack whose output uses a provisional namespace
# (the pack's hook names it) needs the explicit consent input.
name: export CityGML 3 derivative

on:
  workflow_dispatch:
    inputs:
      city_repository:
        description: 'City repository (owner/name) whose CityGML 2 / 1 data is converted'
        required: true
        type: string
      city_ref:
        description: 'Branch, tag or commit of the city repository'
        required: true
        default: 'main'
        type: string
      accept_provisional:
        description: 'Accept a provisional namespace in the output (a pack that writes one refuses without it)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  convert:
    # The development copies' switch (see release-hub.yml); this workflow runs only on dispatch.
    if: vars.CITYGML_CI != 'off' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Validate the inputs
        shell: bash
        env:
          CITY_REPOSITORY: ${{ inputs.city_repository }}
          CITY_REF: ${{ inputs.city_ref }}
        run: |
          [[ "$CITY_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "::error::city_repository must be owner/name"; exit 1; }
          [[ "$CITY_REF" =~ ^[A-Za-z0-9_./-]+$ && "$CITY_REF" != *..* ]] || { echo "::error::city_ref is not a branch, tag or commit"; exit 1; }

      - name: Check out the city's data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.city_repository }}
          ref: ${{ inputs.city_ref }}
          path: data
          token: ${{ secrets.CITY_READ_TOKEN || github.token }}   # the read-only token for private copies (as tests.yml)
          persist-credentials: false

      - name: Check out the converter (this repository at the dispatched commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tooling
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: tooling/.python-version

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install the pinned CI dependencies
        run: python -m pip install --disable-pip-version-check -r tooling/requirements-ci.txt

      - name: Download and verify citygml-tools 2.5.0
        shell: bash
        run: |
          curl -fL --retry 3 \
            https://github.com/citygml4j/citygml-tools/releases/download/v2.5.0/citygml-tools-2.5.0.zip \
            -o citygml-tools.zip
          echo 'bb2949fbc6c3ec44ec85c25a0bcdfe9accde9cbdb9e26ec773889779694710b1  citygml-tools.zip' | sha256sum -c -
          unzip -q citygml-tools.zip

      - name: Export twice, validate, and require identical output
        shell: bash
        env:
          CITY_REPOSITORY: ${{ inputs.city_repository }}
          ACCEPT: ${{ inputs.accept_provisional && '--accept-provisional' || '' }}
        run: |
          for out in derived repeat; do
            python tooling/scripts/export_citygml3.py export --repo data --outdir "$out" \
              --citygml-tools "$PWD/citygml-tools-2.5.0/citygml-tools" $ACCEPT
          done
          diff -r derived repeat
          {
            echo "converter $(git -C tooling rev-parse HEAD)"
            echo "source $CITY_REPOSITORY $(git -C data rev-parse HEAD)"
            echo "citygml-tools 2.5.0"
          } > derived/provenance.txt
          printf '%s\n' 'Derived CityGML 3.0: not a canonical dataset; do not edit. Provisional while a namespace in it is.' > derived/README.txt

      - name: Upload the generated derivative only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: citygml3-derivative
          path: derived/
          retention-days: 7
          if-no-files-found: error
