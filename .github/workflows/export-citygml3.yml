# Manual CityGML 3.0 + i-UR 4 export of a city's CityGML 2.0 dataset (docs/citygml2-to3-iur4.md).
# Moved here from sample-tokyo-station (2026-09-30): the converter is this repository at the
# commit the run is dispatched on, so the derivative always names the converter that made it.
# Nothing is committed or pushed: the result is a 7-day artifact. Provisional until the i4d-UR
# namespace is published, so a run needs the explicit consent input.
name: export CityGML 3 derivative

on:
  workflow_dispatch:
    inputs:
      city_repository:
        description: 'City repository (owner/name) whose CityGML 2 data is converted'
        required: true
        default: '4dcitygml/sample-tokyo-station'
        type: string
      city_ref:
        description: 'Branch, tag or commit of the city repository'
        required: true
        default: 'main'
        type: string
      dataset_dir:
        description: 'CityGML dataset directory below the city repository root'
        required: true
        default: '13101_chiyoda-ku_pref_2023_citygml_1_op'
        type: string
      accept_provisional_i4dur:
        description: 'Generate a PoC artifact with the provisional i4d-UR namespace'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  convert:
    # The development copies' switch (see release-hub.yml); this workflow runs only on dispatch.
    if: vars.CITYGML_CI != 'off' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Require consent to the provisional namespace
        if: ${{ !inputs.accept_provisional_i4dur }}
        run: |
          echo "::error::Set accept_provisional_i4dur to generate the provisional derivative."
          exit 1

      - name: Validate the inputs
        shell: bash
        env:
          CITY_REPOSITORY: ${{ inputs.city_repository }}
          CITY_REF: ${{ inputs.city_ref }}
          DATASET_DIR: ${{ inputs.dataset_dir }}
        run: |
          [[ "$CITY_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "::error::city_repository must be owner/name"; exit 1; }
          [[ "$CITY_REF" =~ ^[A-Za-z0-9_./-]+$ && "$CITY_REF" != *..* ]] || { echo "::error::city_ref is not a branch, tag or commit"; exit 1; }
          [[ "$DATASET_DIR" =~ ^[A-Za-z0-9_.-]+$ && "$DATASET_DIR" != *..* ]] || { echo "::error::dataset_dir must be one directory name"; exit 1; }

      - name: Check out the city's CityGML 2 data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ inputs.city_repository }}
          ref: ${{ inputs.city_ref }}
          path: data
          persist-credentials: false

      - name: Check out the converter (this repository at the dispatched commit)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: tooling
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Install the pinned XML dependency
        run: python -m pip install --disable-pip-version-check 'lxml==6.1.1'

      - name: Download and verify citygml-tools 2.5.0
        shell: bash
        run: |
          curl -fL --retry 3 \
            https://github.com/citygml4j/citygml-tools/releases/download/v2.5.0/citygml-tools-2.5.0.zip \
            -o citygml-tools.zip
          echo 'bb2949fbc6c3ec44ec85c25a0bcdfe9accde9cbdb9e26ec773889779694710b1  citygml-tools.zip' | sha256sum -c -
          unzip -q citygml-tools.zip

      - name: Convert every building GML twice and require identical output
        shell: bash
        env:
          DATASET_DIR: ${{ inputs.dataset_dir }}
          CITY_REPOSITORY: ${{ inputs.city_repository }}
        run: |
          source_root="data/$DATASET_DIR"
          test -d "$source_root/udx/bldg"
          output_root="derived/$DATASET_DIR"
          repeat_root="repeat/$DATASET_DIR"
          mkdir -p "$output_root/codelists/i4d-ur" "$repeat_root/codelists/i4d-ur"
          cp -R "$source_root/codelists/." "$output_root/codelists/"
          cp -R "$source_root/codelists/." "$repeat_root/codelists/"
          cp tooling/schemas/i4dur/1.0/codelists/LegacyIUR3Attribute_key.xml "$output_root/codelists/i4d-ur/"
          cp tooling/schemas/i4dur/1.0/codelists/LegacyIUR3Attribute_key.xml "$repeat_root/codelists/i4d-ur/"
          mkdir -p "$output_root/schemas/i4dur/1.0"
          cp tooling/schemas/i4dur/1.0/i4dUR.xsd "$output_root/schemas/i4dur/1.0/"

          while IFS= read -r -d '' source; do
            relative="${source#"$source_root/"}"
            first="$output_root/$relative"
            second="$repeat_root/$relative"
            mkdir -p "$(dirname "$first")" "$(dirname "$second")"
            python tooling/scripts/convert_citygml2_to3_iur4.py convert \
              "$source" "$first" --citygml-tools "$PWD/citygml-tools-2.5.0/citygml-tools"
            python tooling/scripts/convert_citygml2_to3_iur4.py convert \
              "$source" "$second" --citygml-tools "$PWD/citygml-tools-2.5.0/citygml-tools"
            cmp "$first" "$second"
          done < <(find "$source_root/udx/bldg" -maxdepth 1 -type f -name '*.gml' -print0 | sort -z)

          {
            echo "converter $(git -C tooling rev-parse HEAD)"
            echo "source $CITY_REPOSITORY $(git -C data rev-parse HEAD) $DATASET_DIR"
          } > "$output_root/provenance.txt"
          printf '%s\n' 'PROVISIONAL: not a canonical dataset; do not edit or publish.' > "$output_root/README.txt"

      - name: Upload the generated derivative only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: citygml3-iur4-provisional
          path: derived/
          retention-days: 7
          if-no-files-found: error
