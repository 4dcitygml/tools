# SPDX-License-Identifier: Apache-2.0
# Build the distribution of the integrated front-end (hub) and attach it to Releases on tag push (hub-v*).
# - Windows: an "all-in-one zip" with the bundled Python embeddable package (PythonPortable)
#   and MinGit; works through clone/push with no install. The entry point is
#   start-windows.bat → program/PythonPortable/python.exe program/hub.py.
#   (Decision 2026-08-28: the Windows distribution is the bundled-Python zip only; the
#   former PyInstaller exe was removed so there is exactly one launch path to maintain.)
# - macOS: a zip with no bundled binaries (hub.py, its screens, the editors, the shared modules).
#   Unsigned binaries are blocked by Gatekeeper, so we use the CLT-bundled python3 + git (M1).
#
# Supply-chain rules (A5/A7): everything fetched at build time (MinGit, Python embeddable)
# is pinned by exact version URL and verified against a pinned SHA-256 BEFORE extraction.
# Both zips bundle LICENSE / NOTICE / THIRD_PARTY_NOTICES.md, and the archive contents
# (entry points, licenses, layout) are asserted per OS before upload.
#
# Zip layout (hub-v1.2.0): the zip is the payload of the one-line installer
# (install/citygml.sh | citygml.ps1), not a user-facing download. The only top-level
# item is program/; the installer unpacks it into citygml-tools/citygml-hub/<tag>/ and
# starts program/hub.py. What travels is listed in ONE place, scripts/build_bundle.py
# (the manifest), and checked by scripts/verify_bundle.py; this workflow only calls them,
# and tests/test_bundle.py runs the same two scripts against the source tree, so a
# rename in the code cannot break the release unnoticed.
# Cities distribute no code: nothing is ever loaded from a city clone.
# The data itself is not needed, so only the bundled folders are fetched via blob:none + sparse-checkout.
#
# Note: the embeddable package ships a python314._pth (site disabled, isolated sys.path).
# The "Test extracted bundle" step below runs verify_bundle.py under the bundled python.exe
# against the extracted layout to prove the hub runs there (handover memo §9.2).
name: hub release build

on:
  push:
    tags: ['hub-v*']
  pull_request:
    paths:
      # everything the zip carries or that builds it (hub-v1.3.1: runtime.py and the
      # other shared modules were missing here, so a hotfix to them had no PR build)
      - '.github/workflows/release-hub.yml'
      - 'tools/**'
      - 'scripts/**'
      - 'install/**'
      - 'THIRD_PARTY_NOTICES.md'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to upload directly to specified Release without using Actions temp storage (e.g. hub-v0.2.4)'
        required: false
        type: string

permissions:
  contents: write

env:
  # Pinned bundle inputs. Update THIRD_PARTY_NOTICES.md together with these values.
  MINGIT_URL: https://github.com/git-for-windows/git/releases/download/v2.55.0.windows.5/MinGit-2.55.0.5-64-bit.zip
  MINGIT_SHA256: 56d7b226b7693196cfc71fef26568f536c4a021ab6c37ff2db4287bed908e96e
  PYEMBED_URL: https://www.python.org/ftp/python/3.14.7/python-3.14.7-embed-amd64.zip
  PYEMBED_SHA256: d297e5ff019966817ad8502465176139f2d3d840fa4ed84b13bed399a6ab1f15

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          filter: blob:none
          sparse-checkout: |
            tools/hub
            tools/attr_editor
            tools/tex_editor
            tools/i18n
            tools/themes
            scripts/pr_classification.py
            tools/git_sync.py
            tools/shortcuts.py
            tools/accounts.py
            tools/runtime.py
            scripts/build_bundle.py
            scripts/verify_bundle.py
            install
      - name: Download pinned MinGit and PythonPortable (verify SHA-256 before extraction)
        shell: pwsh
        working-directory: tools/hub
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Set-Location dist
          function Fetch-Verified([string]$url, [string]$expected, [string]$out) {
            curl.exe -fLsS $url -o $out
            if ($LASTEXITCODE -ne 0) { throw "Download failed: $url" }
            $actual = (Get-FileHash $out -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected.ToLowerInvariant()) {
              throw "SHA-256 mismatch: ${out} expected=$expected actual=$actual"
            }
          }
          Fetch-Verified $env:MINGIT_URL $env:MINGIT_SHA256 mingit.zip
          Fetch-Verified $env:PYEMBED_URL $env:PYEMBED_SHA256 pyembed.zip
          # MinGit is the official minimal configuration intended for app bundling. The
          # directory name stays PortableGit for compatibility with existing code.
          Expand-Archive -LiteralPath .\mingit.zip -DestinationPath .\PortableGit -Force
          Expand-Archive -LiteralPath .\pyembed.zip -DestinationPath .\PythonPortable -Force
          if (-not (Test-Path "PortableGit\cmd\git.exe")) { throw "MinGit extraction failed" }
          if (-not (Test-Path "PythonPortable\python.exe")) { throw "PythonPortable extraction failed" }
          if (-not (Test-Path "PythonPortable\LICENSE.txt")) { throw "PythonPortable\LICENSE.txt not found" }
          Remove-Item .\mingit.zip, .\pyembed.zip
      - name: Test MinGit commands
        shell: pwsh
        working-directory: tools/hub/dist
        run: |
          $git = (Resolve-Path ".\PortableGit\cmd\git.exe").Path
          function Run-Git {
            & $git @args
            if ($LASTEXITCODE -ne 0) { throw "MinGit command failed: git $args" }
          }
          foreach ($required in @(
            ".\PortableGit\mingw64\bin\git-remote-https.exe",
            ".\PortableGit\mingw64\bin\git-credential-manager.exe"
          )) {
            if (-not (Test-Path $required)) { throw "MinGit required file missing: $required" }
          }
          Run-Git --version

          $smoke = Join-Path $env:RUNNER_TEMP "mingit-smoke"
          $origin = Join-Path $smoke "origin.git"
          $work = Join-Path $smoke "work"
          New-Item -ItemType Directory -Force -Path $smoke | Out-Null
          Run-Git init --bare $origin
          Run-Git clone $origin $work
          Run-Git -C $work config user.name "MinGit Smoke Test"
          Run-Git -C $work config user.email "mingit-smoke@example.invalid"
          "ok" | Set-Content -Encoding UTF8 (Join-Path $work "smoke.txt")
          Run-Git -C $work add smoke.txt
          Run-Git -C $work commit -m "MinGit smoke test"
          Run-Git -C $work push origin HEAD:main
          $status = & $git -C $work status --porcelain
          if ($LASTEXITCODE -ne 0) { throw "MinGit status verification failed" }
          if ($status) { throw "Working tree is dirty after MinGit verification" }
      - name: Test bundled Python (._pth isolated mode) runs the hub
        shell: pwsh
        working-directory: tools/hub/dist
        run: |
          $py = (Resolve-Path ".\PythonPortable\python.exe").Path
          & $py --version
          if ($LASTEXITCODE -ne 0) { throw "PythonPortable failed to start" }
          # The embeddable ._pth disables site and the script-dir sys.path entry;
          # the hub must still parse (single-file, stdlib-only).
          & $py ..\app.py --help *> $null
          if ($LASTEXITCODE -ne 0) { throw "PythonPortable failed to run app.py" }
      - name: Assemble the Windows zip with scripts/build_bundle.py (the one manifest)
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python scripts/build_bundle.py --flavor windows --tag "${RELEASE_TAG:-$GITHUB_REF_NAME}" --portable tools/hub/dist --out tools/hub/dist
      - name: Verify the archive with scripts/verify_bundle.py (layout, required files, smoke test)
        shell: bash
        run: python scripts/verify_bundle.py tools/hub/dist/citygml-hub-*-windows-full.zip --flavor windows
      - name: Test the extracted bundle under the bundled Python (._pth isolated mode) with the bundled Git
        shell: pwsh
        run: |
          $py = (Resolve-Path "tools\hub\dist\PythonPortable\python.exe").Path
          $zip = (Get-ChildItem "tools\hub\dist\citygml-hub-*-windows-full.zip").FullName
          # The fallback path to the bundled Git on an unconfigured PC, unaffected by the runner's Git settings.
          $env:GIT_CONFIG_GLOBAL = Join-Path $env:RUNNER_TEMP "empty-gitconfig"
          $smoke = Join-Path $env:RUNNER_TEMP "mingit-smoke\work"
          & $py scripts\verify_bundle.py $zip --flavor windows --git-smoke $smoke
          if ($LASTEXITCODE -ne 0) { throw "verification under the bundled Python failed" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        # On PRs, only assemble and verify. Do not depend on artifact storage quota.
        if: github.event_name != 'pull_request' && inputs.release_tag == ''
        with:
          name: hub-windows
          path: tools/hub/dist/citygml-hub-*-windows-full.zip
      - name: Test the Windows installer (install/citygml.ps1) against the built zip
        # Runs the per-user launcher the way a resident's PowerShell 5.1 would, with the
        # test hooks pointing at this build instead of the GitHub API / download:
        # first run installs into a versioned folder, second run starts it without network.
        shell: powershell
        working-directory: tools/hub/dist
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Get-ChildItem -Filter "citygml-hub-*-windows-full.zip" | Select-Object -First 1
          if (-not $zip) { throw "built zip not found" }
          $ver = $zip.Name -replace '^citygml-hub-(.*)-windows-full\.zip$', '$1'
          # PR builds are versioned "dev"; the installer only accepts hub-vX.Y.Z, so present the
          # same file under a contract-shaped name (the file on disk is unchanged). The name must
          # be above the installer's hub-v1.2.0 floor, or the second run would try to fetch a newer one.
          if ($ver -notmatch '^v\d+\.\d+\.\d+$') { $ver = "v99.0.0" }
          $assetName = "citygml-hub-$ver-windows-full.zip"
          $sha = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $rel = @(@{ tag_name = "hub-$ver"; draft = $false; prerelease = $false; html_url = "x";
                      assets = @(@{ name = $assetName; browser_download_url = "u"; digest = "sha256:$sha" }) })
          $json = Join-Path $env:RUNNER_TEMP "releases.json"
          ConvertTo-Json -InputObject $rel -Depth 5 | Set-Content -Encoding UTF8 $json
          $env:CITYGML_TOOLS_DIR = Join-Path $env:RUNNER_TEMP "citygml-tools"
          $env:CITYGML_RELEASES_JSON = $json
          $env:CITYGML_ASSET_FILE = $zip.FullName
          $env:CITYGML_NO_EXEC = "1"
          $script = Resolve-Path "..\..\..\install\citygml.ps1"
          # The child's stderr must not become a terminating error here; judge by exit code and output.
          $ErrorActionPreference = "Continue"
          $out = & powershell -NoProfile -ExecutionPolicy Bypass -File $script "4dcitygml/sample-newyork-station" 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0 -or $out -notmatch "EXEC hub-$ver 4dcitygml/sample-newyork-station") { throw "installer first run failed" }
          if (-not (Test-Path (Join-Path $env:CITYGML_TOOLS_DIR "citygml-hub\hub-$ver\program\PythonPortable\python.exe"))) { throw "installed layout missing bundled Python" }
          Remove-Item Env:CITYGML_RELEASES_JSON; Remove-Item Env:CITYGML_ASSET_FILE
          $out2 = & powershell -NoProfile -ExecutionPolicy Bypass -File $script "4dcitygml/sample-newyork-station" 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or $out2 -notmatch "EXEC hub-$ver") { Write-Host $out2; throw "installer second run (no network) failed" }
          # the hub's "Get it now" = the launcher's fetch mode (the way runtime.fetch_latest_hub calls it):
          # with the hooks pointing at this build it installs (already there) and prints the tag
          $env:CITYGML_RELEASES_JSON = $json; $env:CITYGML_ASSET_FILE = $zip.FullName
          $out3 = & powershell -NoProfile -ExecutionPolicy Bypass -File $script -FetchLatest 2>&1 | Out-String
          $tag = ($out3.Trim() -split "`r?`n")[-1]
          if ($LASTEXITCODE -ne 0 -or $tag -ne "hub-$ver") { Write-Host $out3; throw "fetch mode failed (last line '$tag')" }
          Write-Host "installer OK: first run installed hub-$ver, second run started it without network, fetch mode answers hub-$ver"
      - name: Upload Windows package directly to requested Release
        if: inputs.release_tag != ''
        shell: bash
        working-directory: tools/hub/dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          version="${RELEASE_TAG#hub-}"
          gh release upload "$RELEASE_TAG" "citygml-hub-${version}-windows-full.zip" --clobber

  macos-zip:
    # M1: a zip that bundles no binaries and uses the CLT python3 + git (no signing needed).
    # program/citygml.sh is stored with the execute bit set (the installer copies it into place).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          filter: blob:none
          sparse-checkout: |
            tools/hub
            tools/attr_editor
            tools/tex_editor
            tools/i18n
            tools/themes
            scripts/pr_classification.py
            tools/git_sync.py
            tools/shortcuts.py
            tools/accounts.py
            tools/runtime.py
            scripts/build_bundle.py
            scripts/verify_bundle.py
            install
      - name: Assemble the macOS zip with scripts/build_bundle.py (the one manifest)
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 scripts/build_bundle.py --flavor macos --tag "${RELEASE_TAG:-$GITHUB_REF_NAME}" --out tools/hub/dist
      - name: Verify the archive with scripts/verify_bundle.py (layout, required files, smoke test)
        shell: bash
        run: python3 scripts/verify_bundle.py tools/hub/dist/citygml-hub-*-macos.zip --flavor macos
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        # On PRs, only assemble and verify. Do not depend on artifact storage quota.
        if: github.event_name != 'pull_request' && inputs.release_tag == ''
        with:
          name: hub-macos
          path: tools/hub/dist/citygml-hub-*-macos.zip
      - name: Test the macOS installer (install/citygml.sh) against the built zip
        # Same idea as the Windows step: the per-user launcher with the test hooks
        # (fake releases payload + local asset) — first run installs, second run needs no network.
        shell: bash
        run: |
          set -euo pipefail
          zip="$(ls tools/hub/dist/citygml-hub-*-macos.zip | head -n 1)"
          ver="${zip##*/citygml-hub-}"; ver="${ver%-macos.zip}"
          # PR builds are versioned "dev"; present the file under a contract-shaped name above
          # the installer's hub-v1.2.0 floor (else the second run would try to fetch a newer one).
          [[ "$ver" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || ver="v99.0.0"
          sha="$(sha256sum "$zip" | cut -d' ' -f1)"
          python3 - "$ver" "$sha" > "$RUNNER_TEMP/releases.json" <<'PY'
          import json, sys
          ver, sha = sys.argv[1:]
          print(json.dumps([{"tag_name": f"hub-{ver}", "draft": False, "prerelease": False, "html_url": "x",
                             "assets": [{"name": f"citygml-hub-{ver}-macos.zip", "browser_download_url": "u", "digest": f"sha256:{sha}"}]}]))
          PY
          export CITYGML_TOOLS_DIR="$RUNNER_TEMP/citygml-tools" CITYGML_RELEASES_JSON="$RUNNER_TEMP/releases.json" \
                 CITYGML_ASSET_FILE="$PWD/$zip" CITYGML_NO_EXEC=1
          out="$(bash install/citygml.sh 4dcitygml/sample-newyork-station)"
          echo "$out"; grep -q "EXEC hub-$ver 4dcitygml/sample-newyork-station" <<<"$out"
          test -f "$CITYGML_TOOLS_DIR/citygml-hub/hub-$ver/program/hub.py"
          test -x "$CITYGML_TOOLS_DIR/citygml-hub/hub-$ver/program/citygml.sh"
          unset CITYGML_RELEASES_JSON CITYGML_ASSET_FILE
          out2="$(bash install/citygml.sh 4dcitygml/sample-newyork-station)"
          grep -q "EXEC hub-$ver" <<<"$out2"
          # the hub's "Get it now" = the launcher's fetch mode: the version is already installed, so it
          # answers with the tag and downloads nothing (no releases / asset hooks are set any more)
          out3="$(bash install/citygml.sh --fetch-latest 2>&1 || true)"
          echo "$out3" | tail -n 1 | grep -q "^hub-v" || { echo "$out3"; echo "fetch mode failed"; exit 1; }
          echo "installer OK: first run installed hub-$ver, second run started it without network, fetch mode answers a tag"
      - name: Upload macOS package directly to requested Release
        if: inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          version="${RELEASE_TAG#hub-}"
          gh release upload "$RELEASE_TAG" "tools/hub/dist/citygml-hub-${version}-macos.zip" --clobber

  release:
    if: startsWith(github.ref, 'refs/tags/hub-v')
    needs: [windows, macos-zip]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: hub-*
          path: dist
          merge-multiple: true
      - name: Create release and upload versioned packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#hub-}"
          windows="dist/citygml-hub-${version}-windows-full.zip"
          macos="dist/citygml-hub-${version}-macos.zip"
          test -f "$windows"
          test -f "$macos"
          {
            echo "Install or update with the one-line command in your city's README (install/citygml.sh or citygml.ps1 from the install-v1 tag of 4dcitygml/tools); the hub also offers this version from its update banner. The zips below are the installer's payload: citygml-hub-${version}-windows-full.zip (Python and Git bundled) and citygml-hub-${version}-macos.zip (runs on the Command Line Tools python3/git). SHA-256 digests are published by GitHub on each asset."
            echo
            echo '```'
            (cd dist && sha256sum "citygml-hub-${version}-windows-full.zip" "citygml-hub-${version}-macos.zip")
            echo '```'
          } > notes.md
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --title "citygml-hub $GITHUB_REF_NAME" \
              --notes-file notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" "$windows" "$macos" --clobber
