name: shared tools release build

on:
  push:
    tags: ['tools-v*']
  pull_request:
    paths:
      - '.github/workflows/release-tools.yml'
      - 'scripts/**'
      - 'schemas/**'
      - 'semantics/**'
      - 'ci/**'
      - 'docs/**'
      - 'tools/**'
      - 'README.md'
      - 'requirements.txt'
      - 'LICENSE'
      - 'NOTICE'
      - 'THIRD_PARTY_NOTICES.md'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing tools-v tag whose Release receives the source archive (built, then published after the production approval); leave empty to build without publishing'
        required: false
        type: string

permissions:
  contents: write

jobs:
  validate-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate release series before building
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          tag="$REQUESTED_TAG"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then tag="$GITHUB_REF_NAME"; fi
          if [[ -n "$tag" ]]; then
            [[ "$tag" =~ ^tools-v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]] || {
              echo '::error::Expected a tools-v release tag'; exit 1;
            }
          fi
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && -z "$REQUESTED_TAG" && "$GITHUB_REF_TYPE" != branch ]]; then
            echo '::error::Build-only dispatch must select a branch'; exit 1
          fi

  common-tools:
    needs: validate-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build common-tools source archive
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          tag="${REQUESTED_TAG:-$GITHUB_REF_NAME}"
          mkdir -p "$RUNNER_TEMP/common-tools-dist"
          if [[ "$tag" == tools-v* ]]; then
            version="${tag#*-}"
            python scripts/build_common_tools.py build --root . --release-tag "$tag" \
              --output "$RUNNER_TEMP/common-tools-dist/citygml-tools-${version}-source.zip"
          else
            python scripts/build_common_tools.py build --root . --local \
              --output "$RUNNER_TEMP/common-tools-dist/citygml-tools-local-source.zip"
          fi
      - name: Smoke-test the common-tools archive
        run: |
          set -euo pipefail
          python -m pip install --quiet "lxml==6.1.1"
          archive=("$RUNNER_TEMP"/common-tools-dist/*.zip)
          python scripts/build_common_tools.py verify "${archive[0]}"
          python -m zipfile -e "${archive[0]}" "$RUNNER_TEMP/common-tools-smoke"
          cd "$RUNNER_TEMP/common-tools-smoke/citygml-tools"
          python -I scripts/lod0_semantic_manifest.py --help
          python -I scripts/commit_building_scope.py --help
          python -I scripts/validate_citygml.py --help
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        # On PRs, only build and verify. The archive is handed to the gated release job.
        if: github.event_name != 'pull_request'
        with:
          name: tools-source
          path: ${{ runner.temp }}/common-tools-dist/*.zip

  release:
    # The only job that publishes. It runs in the `production` environment, so it waits
    # for the deployment approval (docs/production-protection.md); the builds and smoke
    # tests above run unattended and nothing reaches users before that approval.
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/tools-v')) || inputs.release_tag != ''
    needs: common-tools
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tools-source
          path: dist
      - name: Create the release for a pushed tag, then upload the source archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#tools-}"
          common="dist/citygml-tools-${version}-source.zip"
          test -f "$common"
          {
            echo "4dcitygml tools ${version}: city processing, CI, schemas, semantic definitions and documentation. Python dependencies are required."
            echo
            echo "Hub clients for Mac and Windows are distributed separately in hub-v releases. City CI pins the tools source commit; downloading this archive does not update a city automatically."
            echo
            echo '```'
            (cd dist && sha256sum "citygml-tools-${version}-source.zip")
            echo '```'
          } > notes.md
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # A manual run names an existing Release; only a pushed tag creates one.
            [[ "$GITHUB_REF" == refs/tags/* ]] || { echo "::error::Release $RELEASE_TAG does not exist"; exit 1; }
            gh release create "$RELEASE_TAG" --verify-tag --latest=false \
              --title "4dcitygml tools ${version}" --notes-file notes.md
          fi
          gh release upload "$RELEASE_TAG" "$common"
