name: shared tools release build

on:
  push:
    tags: ['tools-v*']
  pull_request:
    paths:
      - '.github/workflows/release-tools.yml'
      - 'scripts/**'
      - 'schemas/**'
      - 'semantics/**'
      - 'ci/**'
      - 'docs/**'
      - 'tools/**'
      - 'README.md'
      - 'requirements.txt'
      - 'requirements-ci.txt'
      - '.python-version'
      - '.github/workflows/release-publish.yml'
      - 'LICENSE'
      - 'NOTICE'
      - 'THIRD_PARTY_NOTICES.md'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing tools-v tag whose Release receives the source archive (built, then published after the production approval); leave empty to build without publishing'
        required: false
        type: string

permissions:
  contents: write

jobs:
  validate-release:
    # One switch for a development copy: the repository variable CITYGML_CI set to `off`
    # skips every automatic run (the other jobs need this one); a manual run still works,
    # so one workflow can be exercised on demand. Production sets nothing.
    if: vars.CITYGML_CI != 'off' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release series before building
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          tag="$REQUESTED_TAG"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then tag="$GITHUB_REF_NAME"; fi
          if [[ -n "$tag" ]]; then
            python3 scripts/release_tags.py check tools "$tag" >/dev/null   # the one tag grammar
          fi
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && -z "$REQUESTED_TAG" && "$GITHUB_REF_TYPE" != branch ]]; then
            echo '::error::Build-only dispatch must select a branch'; exit 1
          fi

  common-tools:
    needs: validate-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Build common-tools source archive
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          tag="${REQUESTED_TAG:-$GITHUB_REF_NAME}"
          mkdir -p "$RUNNER_TEMP/common-tools-dist"
          if [[ "$tag" == tools-v* ]]; then
            version="${tag#*-}"
            python scripts/build_common_tools.py build --root . --release-tag "$tag" \
              --output "$RUNNER_TEMP/common-tools-dist/citygml-tools-${version}-source.zip"
          else
            python scripts/build_common_tools.py build --root . --local \
              --output "$RUNNER_TEMP/common-tools-dist/citygml-tools-local-source.zip"
          fi
      - name: Smoke-test the common-tools archive
        run: |
          set -euo pipefail
          python -m pip install --quiet -r requirements-ci.txt
          archive=("$RUNNER_TEMP"/common-tools-dist/*.zip)
          python scripts/build_common_tools.py verify "${archive[0]}"
          python -m zipfile -e "${archive[0]}" "$RUNNER_TEMP/common-tools-smoke"
          cd "$RUNNER_TEMP/common-tools-smoke/citygml-tools"
          python -I dialects/plateau/lod0_semantic_manifest.py --help
          python -I scripts/commit_building_scope.py --help
          python -I scripts/validate_citygml.py --help
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # On PRs, only build and verify. The archive is handed to the gated release job.
        if: github.event_name != 'pull_request'
        with:
          name: tools-source
          path: ${{ runner.temp }}/common-tools-dist/*.zip

  release:
    # The one publishing job (release-publish.yml): the production approval, notes from the tag.
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/tools-v')) || inputs.release_tag != ''
    needs: common-tools
    uses: ./.github/workflows/release-publish.yml
    with:
      tag: ${{ inputs.release_tag || github.ref_name }}
      series: tools
      title: 4dcitygml tools
      artifacts: tools-source
