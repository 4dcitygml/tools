# Run the test suite on every pull request and on main. The release workflows build
# and smoke-test the archives; this is the only place the tests themselves run.
# The contract tests read the city repositories next to this one: they are checked out
# read-only at the commits ci/city-refs.json names (one workflow for every copy of tools;
# only that file, and whether a read-only token for private copies exists, differ).
name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    # The development copies' switch (see release-hub.yml): CITYGML_CI=off skips automatic runs.
    if: vars.CITYGML_CI != 'off' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: tools
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - name: Install the pinned requirements and pytest
        working-directory: tools
        run: python -m pip install --quiet -r requirements.txt pytest
      - name: Check out the city repositories the contract tests read (read-only, pinned)
        env:
          CITY_READ_TOKEN: ${{ secrets.CITY_READ_TOKEN }}   # only for private copies; public ones are read anonymously
        run: bash tools/ci/city_checkouts.sh tools/ci/city-refs.json .
      - name: Run the suite
        working-directory: tools
        run: python -m pytest -q -p no:cacheprovider -rs
