# Run the test suite on every pull request and on main. The release workflows build
# and smoke-test the archives; this is the only place the tests themselves run.
# Tests that need the sibling city checkouts skip on a runner (they run on the
# maintainer's computer, where the checkouts sit next to this one).
name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    # The development copies' switch (see release-hub.yml): CITYGML_CI=off skips automatic runs.
    if: vars.CITYGML_CI != 'off' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the pinned requirements and pytest
        run: python -m pip install --quiet -r requirements.txt pytest
      - name: Run the suite
        run: python -m pytest -q -p no:cacheprovider
